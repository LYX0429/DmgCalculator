<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>洛克王国 伤害计算器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>洛克王国 伤害计算器</h1>

    <div class="battle-row">
      <section class="panel saved-creatures-panel">
        <div class="panel-header">
          <h2>已保存精灵</h2>
          <button id="save-creature-btn" class="save-creature-btn">保存当前精灵</button>
        </div>
        <div id="saved-creatures" class="saved-creatures-grid"></div>
      </section>

      <section class="panel common-moves-panel">
        <h2>常用技能</h2>
        <div id="common-moves" class="common-moves-grid"></div>
      </section>

      <section class="panel attacker-panel">
        <div class="panel-header">
          <h2>我方</h2>
          <div id="attacker-default-btns" class="attacker-default-btns"></div>
        </div>
        <label>精灵
          <div class="csearch-wrap">
            <input type="text" id="attacker-search-input" class="csearch-input" placeholder="搜索精灵…" autocomplete="off" spellcheck="false">
            <div id="attacker-search-list" class="csearch-list" hidden></div>
          </div>
          <select id="attacker-select" hidden></select>
        </label>
        <div id="attacker-stats" class="stat-grid"></div>
        <div id="attacker-presets" class="attacker-presets"></div>
      </section>

      <div class="swap-col">
        <button id="swap-btn" title="交换攻守精灵">⇄</button>
      </div>

      <section class="panel defender-panel">
        <h2>敌方</h2>
        <label>精灵
          <div class="csearch-wrap">
            <input type="text" id="defender-search-input" class="csearch-input" placeholder="搜索精灵…" autocomplete="off" spellcheck="false">
            <div id="defender-search-list" class="csearch-list" hidden></div>
          </div>
          <select id="defender-select" hidden></select>
        </label>
        <div id="defender-stats" class="stat-grid"></div>
        <div id="defender-presets" class="attacker-presets"></div>
      </section>
      <div class="move-col">
        <section class="panel move-panel">
          <div id="move-info-bar" class="move-info-bar"></div>
          <label class="move-select-label">技能<select id="move-select"></select></label>
        </section>
        <section class="panel power-panel" id="power-panel">
          <div id="power-breakdown" class="power-breakdown"></div>
        </section>
        <section class="panel common-enemies-panel">
          <div class="panel-header">
            <h2>常见敌人</h2>
            <button id="lock-enemy-btn" class="lock-enemy-btn">锁定敌方阵容</button>
            <button id="save-enemy-btn" class="save-creature-btn">保存当前敌人</button>
          </div>
          <div id="common-enemies" class="common-enemies-grid"></div>
        </section>
      </div>
    </div>

    <section class="panel result-panel" id="result-panel" hidden>
      <h2>伤害结果</h2>
      <p class="result-subtitle">当前敌方配置</p>
      <div id="result-current"></div>
      <p class="result-subtitle" style="margin-top:0.8rem">假设区间</p>
      <div id="result-bars"></div>
    </section>
  </div>

  <script src="data/moves.js"></script>
  <script src="data/creatures.js"></script>
  <script src="data/buffs.js"></script>
  <script src="calculator.js"></script>
  <script src="app.js"></script>
</body>
</html>
